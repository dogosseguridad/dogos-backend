<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOGOS SEGURIDAD - Central de Monitoreo</title>
  
  <!-- Estilos de Leaflet (Mapa Gratuito) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1E1E1E;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }
    .brand h1 {
      color: #E53935;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .brand p {
      color: #888;
      font-size: 11px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .silence-btn {
      background-color: #f59e0b;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }
    .estado-badge {
      background-color: #D32F2F;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }
    .estado-badge.online {
      background-color: #2E7D32;
    }
    #main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #sidebar {
      width: 350px;
      background-color: #181818;
      border-right: 1px solid #2A2A2A;
      display: flex;
      flex-direction: column;
    }
    .tabs-header {
      display: flex;
      background-color: #222;
      border-bottom: 1px solid #333;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: #222;
      color: #888;
      border: none;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #333;
      color: #fff;
      border-bottom: 2px solid #E53935;
    }
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .alerta-card {
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .alerta-card.panico {
      background-color: #261313;
      border: 1px solid #D32F2F;
    }
    .alerta-card.encasa {
      background-color: #132616;
      border: 1px solid #2E7D32;
    }
    .alerta-card.meyvoy {
      background-color: #262113;
      border: 1px solid #EAB308;
    }
    .alerta-card h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }
    .alerta-card p {
      font-size: 12px;
      color: #DDD;
      margin-top: 2px;
    }
    .cliente-card {
      background-color: #222;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      border-left: 4px solid #757575;
    }
    .cliente-card.activo {
      border-left-color: #2E7D32;
    }
    #map {
      flex: 1;
      height: 100%;
      background-color: #090d16;
    }
    /* Ocultar posibles carteles flotantes residuales */
    .gm-err-container, .leaflet-control-attribution a[href*="google"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>DOGOS SEGURIDAD</h1>
      <p>Misión dada es misión cumplida</p>
    </div>
    <div class="header-actions">
      <button id="silenceBtn" class="silence-btn" onclick="silenciarAudios()">🔕 Silenciar Sonido</button>
      <div id="estadoCentral" class="estado-badge">🔴 Conectando...</div>
    </div>
  </header>

  <div id="main-container">
    <div id="sidebar">
      <!-- Pestañas de Navegación -->
      <div class="tabs-header">
        <button onclick="cambiarPestana('alertas')" id="tab-alertas" class="tab-btn active">🚨 Alertas</button>
        <button onclick="cambiarPestana('clientes')" id="tab-clientes" class="tab-btn">👥 Clientes (<span id="cant-clientes">0</span>)</button>
      </div>

      <!-- Sección 1: Eventos / Alertas -->
      <div id="sec-alertas" class="tab-content">
        <p id="msg-espera-alertas" style="color: #666; font-size: 12px; text-align: center; margin-top: 20px;">
          Esperando señales del sistema...
        </p>
        <div id="alertas-list"></div>
      </div>

      <!-- Sección 2: Clientes Registrados -->
      <div id="sec-clientes" class="tab-content" style="display: none;">
        <div id="clientes-list">
          <p style="color: #666; font-size: 12px; text-align: center; margin-top: 20px;">
            Sin clientes registrados aún.
          </p>
        </div>
      </div>
    </div>

    <!-- Área del Mapa -->
    <div id="map"></div>
  </div>

  <!-- Sonidos Diferenciados -->
  <audio id="sound-panico" loop preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/1005/1005-preview.mp3" type="audio/mpeg">
  </audio>
  <audio id="sound-encasa" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>
  <audio id="sound-meyvoy" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3" type="audio/mpeg">
  </audio>

  <!-- Librerías JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    // Inicializar mapa CartoDB (Libre, Sin API Key)
    const map = L.map('map').setView([-31.2526, -61.4916], 13);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    const marcadores = {};

    const socket = io('https://dogos-backend.onrender.com', {
      transports: ['websocket', 'polling']
    });

    const estadoCentral = document.getElementById('estadoCentral');
    const alertasContainer = document.getElementById('alertas-list');

    socket.on('connect', () => {
      estadoCentral.innerText = '🟢 Central Online';
      estadoCentral.classList.add('online');
    });

    socket.on('disconnect', () => {
      estadoCentral.innerText = '🔴 Central Offline';
      estadoCentral.classList.remove('online');
    });

    // --- RECEPCIÓN DE ALERTAS Y EVENTOS ---
    socket.on('alerta_panico', (data) => procesarEvento(data, 'panico'));
    socket.on('evento_estoy_en_casa', (data) => procesarEvento(data, 'estoy_en_casa'));
    socket.on('evento_me_voy_de_casa', (data) => procesarEvento(data, 'me_voy_de_casa'));
    socket.on('nueva_alerta', (data) => procesarEvento(data, data.tipo || 'panico'));

    function procesarEvento(data, tipo) {
      const msgEspera = document.getElementById('msg-espera-alertas');
      if (msgEspera) msgEspera.remove();

      const id = data.usuarioId || data.cliente || 'CLIENTE_01';
      const lat = data.latitud || -31.2526;
      const lon = data.longitud || -61.4916;
      const hora = new Date().toLocaleTimeString();

      let titulo = '🚨 PÁNICO RECIBIDO';
      let clase = 'panico';

      if (tipo === 'estoy_en_casa' || tipo === 'encasa') {
        titulo = '🏠 LLEGADA A CASA';
        clase = 'encasa';
      } else if (tipo === 'me_voy_de_casa' || tipo === 'meyvoy') {
        titulo = '🚪 SALIDA DE CASA';
        clase = 'meyvoy';
      }

      reproducirSonido(clase);

      const card = document.createElement('div');
      card.className = `alerta-card ${clase}`;
      card.onclick = () => map.setView([lat, lon], 16);
      card.innerHTML = `
        <h4>${titulo}</h4>
        <p><strong>Cliente:</strong> ${id}</p>
        <p><strong>Hora:</strong> ${hora}</p>
        <p><strong>Ubicación:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
      `;
      alertasContainer.prepend(card);

      if (marcadores[id]) {
        map.removeLayer(marcadores[id]);
      }

      const marker = L.marker([lat, lon]).addTo(map)
        .bindPopup(`<b>${titulo}</b><br>ID: ${id}<br>Hora: ${hora}`)
        .openPopup();

      marcadores[id] = marker;
      map.setView([lat, lon], 15);
    }

    // --- GESTIÓN DE CLIENTES REGISTRADOS ---
    socket.on('cargar_clientes', (listaClientes) => {
      const contClientes = document.getElementById('clientes-list');
      const cantClientes = document.getElementById('cant-clientes');

      cantClientes.innerText = listaClientes.length;

      if (!listaClientes || listaClientes.length === 0) {
        contClientes.innerHTML = `<p style="color: #666; font-size: 12px; text-align: center; margin-top: 20px;">Sin clientes registrados.</p>`;
        return;
      }

      contClientes.innerHTML = '';
      listaClientes.forEach(cli => {
        const esActivo = cli.estado === 'Activo';
        const card = document.createElement('div');
        card.className = `cliente-card ${esActivo ? 'activo' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color: #fff; font-size: 13px;">${cli.cliente || cli.usuarioId}</strong>
            <span style="font-size: 10px; background: ${esActivo ? '#2E7D32' : '#666'}; color: white; padding: 2px 6px; border-radius: 10px;">${cli.estado || 'Registrado'}</span>
          </div>
          <p style="color: #aaa; font-size: 11px; margin-top: 4px;"><strong>ID:</strong> ${cli.usuarioId}</p>
          <p style="color: #aaa; font-size: 11px;"><strong>Teléfono:</strong> ${cli.telefono || 'Sin especificar'}</p>
          <p style="color: #aaa; font-size: 11px;"><strong>Dirección:</strong> ${cli.direccion || 'Sin especificar'}</p>
        `;
        contClientes.appendChild(card);
      });
    });

    // --- CONTROL DE PESTAÑAS ---
    function cambiarPestana(tipo) {
      const secAlertas = document.getElementById('sec-alertas');
      const secClientes = document.getElementById('sec-clientes');
      const tabAlertas = document.getElementById('tab-alertas');
      const tabClientes = document.getElementById('tab-clientes');

      if (tipo === 'alertas') {
        secAlertas.style.display = 'block';
        secClientes.style.display = 'none';
        tabAlertas.classList.add('active');
        tabClientes.classList.remove('active');
      } else {
        secAlertas.style.display = 'none';
        secClientes.style.display = 'block';
        tabClientes.classList.add('active');
        tabAlertas.classList.remove('active');
      }
    }

    // --- REPRODUCCIÓN DE AUDIOS ---
    function reproducirSonido(clase) {
      silenciarAudios();
      let audio;
      if (clase === 'panico') audio = document.getElementById('sound-panico');
      if (clase === 'encasa') audio = document.getElementById('sound-encasa');
      if (clase === 'meyvoy') audio = document.getElementById('sound-meyvoy');

      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        document.getElementById('silenceBtn').style.display = 'block';
      }
    }

    function silenciarAudios() {
      ['sound-panico', 'sound-encasa', 'sound-meyvoy'].forEach(id => {
        const a = document.getElementById(id);
        if (a) {
          a.pause();
          a.currentTime = 0;
        }
      });
      document.getElementById('silenceBtn').style.display = 'none';
    }
  </script>
</body>
</html>
