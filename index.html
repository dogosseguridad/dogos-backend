<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOGOS SEGURIDAD - Central de Monitoreo</title>
  
  <!-- Estilos de Leaflet (OBLIGATORIO para renderizar el mapa correctamente) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1E1E1E;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }
    .brand h1 {
      color: #E53935;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .brand p {
      color: #888;
      font-size: 11px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .silence-btn {
      background-color: #f59e0b;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }
    .estado-badge {
      background-color: #D32F2F;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }
    .estado-badge.online {
      background-color: #2E7D32;
    }
    #main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #sidebar {
      width: 340px;
      background-color: #181818;
      border-right: 1px solid #2A2A2A;
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      padding: 15px;
      background-color: #222;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px solid #333;
      color: #AAA;
    }
    #alertas-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .alerta-card {
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .alerta-card.panico {
      background-color: #261313;
      border: 1px solid #D32F2F;
    }
    .alerta-card.encasa {
      background-color: #132616;
      border: 1px solid #2E7D32;
    }
    .alerta-card.meyvoy {
      background-color: #262113;
      border: 1px solid #D32F2F;
    }
    .alerta-card h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }
    .alerta-card p {
      font-size: 12px;
      color: #DDD;
      margin-top: 2px;
    }
    #map {
      flex: 1;
      height: 100%;
      background-color: #090d16;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>DOGOS SEGURIDAD</h1>
      <p>Misión dada es misión cumplida</p>
    </div>
    <div class="header-actions">
      <button id="silenceBtn" class="silence-btn" onclick="silenciarAudios()">🔕 Silenciar Sonido</button>
      <div id="estadoCentral" class="estado-badge">🔴 Conectando...</div>
    </div>
  </header>

  <div id="main-container">
    <div id="sidebar">
      <div class="panel-title">🚨 PANEL DE EMERGENCIAS Y ESTADOS</div>
      <div id="alertas-list">
        <p id="msg-espera" style="color: #666; font-size: 12px; text-align: center; margin-top: 20px;">
          Esperando señales del sistema...
        </p>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <!-- Reproductores de Audio Diferenciados -->
  <audio id="sound-panico" loop preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/1005/1005-preview.mp3" type="audio/mpeg">
  </audio>
  <audio id="sound-encasa" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>
  <audio id="sound-meyvoy" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3" type="audio/mpeg">
  </audio>

  <!-- Librerías de Leaflet y Socket.io -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    // Inicializar Mapa centrado en Rafaela
    const map = L.map('map').setView([-31.2526, -61.4916], 13);
    
    // CAPA GRATUITA DE CARTODB (Evita el bloqueo 403 y no pide API Key)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    const marcadores = {};

    // Conexión con el servidor backend en Render
    const socket = io('https://dogos-backend.onrender.com', {
      transports: ['websocket', 'polling']
    });

    const estadoCentral = document.getElementById('estadoCentral');
    const alertasContainer = document.getElementById('alertas-list');

    socket.on('connect', () => {
      estadoCentral.innerText = '🟢 Central Online';
      estadoCentral.classList.add('online');
    });

    socket.on('disconnect', () => {
      estadoCentral.innerText = '🔴 Central Offline';
      estadoCentral.classList.remove('online');
    });

    // Escuchar los distintos tipos de eventos
    socket.on('nueva_alerta', (data) => procesarAlerta(data, 'panico'));
    socket.on('alerta_panico', (data) => procesarAlerta(data, 'panico'));
    socket.on('evento_estoy_en_casa', (data) => procesarAlerta(data, 'estoy_en_casa'));
    socket.on('evento_me_voy_de_casa', (data) => procesarAlerta(data, 'me_voy_de_casa'));

    function procesarAlerta(data, tipo = 'panico') {
      const msgEspera = document.getElementById('msg-espera');
      if (msgEspera) msgEspera.remove();

      const id = data.usuarioId || data.cliente || 'CLIENTE_01';
      const lat = data.latitud || -31.2526;
      const lon = data.longitud || -61.4916;
      const hora = new Date().toLocaleTimeString();

      let titulo = '🚨 PÁNICO RECIBIDO';
      let clase = 'panico';

      if (tipo === 'estoy_en_casa') {
        titulo = '🏠 LLEGADA A CASA';
        clase = 'encasa';
      } else if (tipo === 'me_voy_de_casa') {
        titulo = '🚪 SALIDA DE CASA';
        clase = 'meyvoy';
      }

      reproducirSonido(tipo);

      const card = document.createElement('div');
      card.className = `alerta-card ${clase}`;
      card.onclick = () => map.setView([lat, lon], 16);
      card.innerHTML = `
        <h4>${titulo}</h4>
        <p><strong>Dispositivo/Cliente:</strong> ${id}</p>
        <p><strong>Hora:</strong> ${hora}</p>
        <p><strong>Ubicación:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
      `;
      alertasContainer.prepend(card);

      if (marcadores[id]) {
        map.removeLayer(marcadores[id]);
      }

      const marker = L.marker([lat, lon]).addTo(map)
        .bindPopup(`<b>${titulo}</b><br>ID: ${id}<br>Hora: ${hora}`)
        .openPopup();

      marcadores[id] = marker;
      map.setView([lat, lon], 15);
    }

    function reproducirSonido(tipo) {
      silenciarAudios();
      let audio;
      if (tipo === 'panico') audio = document.getElementById('sound-panico');
      if (tipo === 'estoy_en_casa') audio = document.getElementById('sound-encasa');
      if (tipo === 'me_voy_de_casa') audio = document.getElementById('sound-meyvoy');

      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        document.getElementById('silenceBtn').style.display = 'block';
      }
    }

    function silenciarAudios() {
      ['sound-panico', 'sound-encasa', 'sound-meyvoy'].forEach(id => {
        const a = document.getElementById(id);
        if (a) {
          a.pause();
          a.currentTime = 0;
        }
      });
      document.getElementById('silenceBtn').style.display = 'none';
    }
  </script>
</body>
</html>
