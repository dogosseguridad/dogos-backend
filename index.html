<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOGOS SEGURIDAD - Central de Monitoreo</title>
  
  <!-- Estilos de Leaflet para el Mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1E1E1E;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }
    .brand h1 {
      color: #E53935;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .brand p {
      color: #888;
      font-size: 11px;
    }
    .estado-badge {
      background-color: #D32F2F;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }
    .estado-badge.online {
      background-color: #2E7D32;
    }
    #main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      background-color: #181818;
      border-right: 1px solid #2A2A2A;
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      padding: 15px;
      background-color: #222;
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #333;
      color: #AAA;
    }
    #alertas-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .alerta-card {
      background-color: #261313;
      border: 1px solid #D32F2F;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }
    .alerta-card h4 {
      color: #FF5252;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .alerta-card p {
      font-size: 12px;
      color: #DDD;
      margin-top: 2px;
    }
    #map {
      flex: 1;
      height: 100%;
      background-color: #000;
    }
    @keyframes pulse {
      0% { border-color: #D32F2F; }
      50% { border-color: #FF5252; }
      100% { border-color: #D32F2F; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>DOGOS SEGURIDAD</h1>
      <p>Misión dada es misión cumplida</p>
    </div>
    <div id="estadoCentral" class="estado-badge">🔴 Conectando...</div>
  </header>

  <div id="main-container">
    <div id="sidebar">
      <div class="panel-title">🚨 PANEL DE EMERGENCIAS Y ESTADOS</div>
      <div id="alertas-list">
        <p style="color: #666; font-size: 12px; text-align: center; margin-top: 20px;">
          Esperando señales del sistema...
        </p>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <!-- Librerías de Leaflet (Mapa) y Socket.io -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    // Inicializar Mapa centrado en Rafaela
    const map = L.map('map').setView([-31.2526, -61.4916], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const marcadores = {};

    // Conexión con el servidor backend en Render
    const socket = io('https://dogos-backend.onrender.com', {
      transports: ['websocket', 'polling']
    });

    const estadoCentral = document.getElementById('estadoCentral');
    const alertasContainer = document.getElementById('alertas-list');

    socket.on('connect', () => {
      estadoCentral.innerText = '🟢 Central Online';
      estadoCentral.classList.add('online');
    });

    socket.on('disconnect', () => {
      estadoCentral.innerText = '🔴 Central Offline';
      estadoCentral.classList.remove('online');
    });

    // Escuchar alertas de pánico recibidas
    socket.on('nueva_alerta', (data) => {
      procesarAlerta(data);
    });

    socket.on('alerta_panico', (data) => {
      procesarAlerta(data);
    });

    function procesarAlerta(data) {
      // Limpiar mensaje inicial de espera si existe
      if (alertasContainer.innerHTML.includes('Esperando señales')) {
        alertasContainer.innerHTML = '';
      }

      const id = data.usuarioId || 'CLIENTE_DESCONOCIDO';
      const lat = data.latitud || -31.2526;
      const lon = data.longitud || -61.4916;
      const hora = new Date().toLocaleTimeString();

      // Agregar tarjeta a la columna izquierda
      const card = document.createElement('div');
      card.className = 'alerta-card';
      card.innerHTML = `
        <h4>🚨 PÁNICO RECIBIDO</h4>
        <p><strong>Dispositivo:</strong> ${id}</p>
        <p><strong>Hora:</strong> ${hora}</p>
        <p><strong>Ubicación:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
      `;
      alertasContainer.prepend(card);

      // Ubicar marcador en el mapa
      if (marcadores[id]) {
        map.removeLayer(marcadores[id]);
      }

      const marker = L.marker([lat, lon]).addTo(map)
        .bindPopup(`<b>🚨 ALERTA DE PÁNICO</b><br>ID: ${id}<br>Hora: ${hora}`)
        .openPopup();

      marcadores[id] = marker;
      map.setView([lat, lon], 15);
    }
  </script>
</body>
</html>
